<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TaskMaster</title>
    <link rel="stylesheet" href="css/style-auth.css">
</head>
<body>
    <div class="auth-container">
        <form id="login-form">
            <h2>Iniciar Sesión</h2>
            <p>Bienvenido de nuevo.</p>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            
            <a href="forgot-password.html" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
            
            <button type="submit">Entrar</button>
            <p class="auth-switch">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
