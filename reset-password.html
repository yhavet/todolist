<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - TaskMaster</title>
    <link rel="stylesheet" href="css/style-auth.css">
</head>
<body>
    <div class="auth-container">
        <form id="reset-form">
            <h2>Crea tu nueva contraseña</h2>
            <p>Ingresa tu nueva contraseña a continuación.</p>
            <input type="password" id="password" placeholder="Nueva contraseña" required>
            <input type="password" id="password_confirm" placeholder="Confirmar nueva contraseña" required>
            <button type="submit">Guardar Contraseña</button>
             <p id="message-area" class="message-area"></p>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
