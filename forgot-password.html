<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - TaskMaster</title>
    <link rel="stylesheet" href="css/style-auth.css">
</head>
<body>
    <div class="auth-container">
        <form id="forgot-form">
            <h2>¿Olvidaste tu contraseña?</h2>
            <p>Ingresa tu email y te enviaremos un enlace para restablecerla.</p>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <button type="submit">Enviar enlace</button>
            <p class="auth-switch">Volver a <a href="index.html">Iniciar sesión</a></p>
            <p id="message-area" class="message-area"></p>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
